  #side{overflow:auto;scrollbar-width:thin}

<style>
  #hud .hud-right{margin-right:88px}
  #language-control{position:fixed;z-index:110;top:16px;right:18px;display:flex;align-items:center;height:39px;padding:4px 6px;border:1px solid var(--line);border-radius:13px;background:var(--paper-solid);box-shadow:var(--shadow)}

<body>
<div id="language-control"><select id="language-select" aria-label="Language"><option value="en" data-no-translate>English</option><option value="fr" data-no-translate>Français</option></select></div>
<canvas id="cv" tabindex="0" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Enter Escape R Space" aria-label="Palimpsity valley. Use the arrow keys to choose a tile and Enter to build or inspect."></canvas>
<div id="loading" role="status"><div class="loading-mark">P</div><strong>The valley is taking shape…</strong><span>Loading the models created in Blender.</span></div>

<header id="hud">
  <div class="brand panel"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><h1>PALIMPSITY</h1><p>A city that changes the rules</p></div></div>
  <div id="hud-res" class="panel"></div>
  <div class="hud-right">
    <div id="clock" class="panel"></div>
    <div id="speed" class="panel"></div>
    <div class="camera-tools panel">
      <button type="button" data-projection="ortho" aria-pressed="false" title="Orthographic view">Orthographic</button>
      <button type="button" data-projection="perspective" class="on" aria-pressed="true" title="Soft perspective">Soft perspective</button>
      <button type="button" id="camera-home" title="Recenter on the valley" aria-label="Recenter on the valley">⌂</button>
    </div>
  </div>
</header>
<div id="regimes" class="panel"></div>
<div id="lenses"></div>
<aside id="side">
  <details id="objectives"><summary id="objectives-summary">Thriving city</summary><div id="objectives-list"></div></details>
  <div id="advisors"></div>
  <div id="diagnostic"></div>
  <div id="inspector"></div>
</aside>
<div id="placement-status" role="status" hidden></div>
<nav id="palette" class="panel" aria-label="Build"></nav>
<div id="help" class="panel"><span><b>Click</b> build / inspect</span><span><b>Drag</b> rotate</span><span><b>Right drag</b> pan</span><span><b>Scroll</b> zoom</span><span><b>R</b> rotate</span><span><b>Arrows + Enter</b> keyboard</span><span><b>Escape</b> cancel</span></div>
<div id="build-note">Custom diorama · models created in Blender</div>
<div id="modal"></div>
<div id="toast" aria-live="polite" aria-atomic="true"></div>
<div id="end"></div>
